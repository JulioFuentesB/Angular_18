<h2>Generos</h2>
<button mat-flat-button routerLink="/generos/crear">Crear nuevo</button>

<!-- <div>
    Estamos en produccion: {{estamosEnProduccion}}
</div> -->

<app-listado-generico [listado]="generos">
    <ng-container contenido>
        <table mat-table [dataSource]="generos" class="mat-elevation-z8 indice-elementos">
            <ng-container matColumnDef="id">
                <th mat-header-cell *matHeaderCellDef>Id</th>
                <td mat-cell *matCellDef="let elemeto">{{elemeto.id}}</td>
            </ng-container>

            <ng-container matColumnDef="nombre">
                <th mat-header-cell *matHeaderCellDef>Nombre</th>
                <td mat-cell *matCellDef="let elemeto">{{elemeto.nombre}}</td>
            </ng-container>

            <ng-container matColumnDef="acciones">
                <th mat-header-cell *matHeaderCellDef>Acciones</th>
                <td mat-cell *matCellDef="let elemento">
                    <a routerLink="/generos/editar/{{elemento.id}}"mat-flat-button >Editar</a>
                    <button mat-flat-button color="warn" >Borrar</button>
                </td>
            </ng-container>

            <tr mat-header-row *matHeaderRowDef="columnasAMostrar"></tr>
            <tr mat-row *matRowDef="let row; columns: columnasAMostrar" ></tr>

        </table>
    </ng-container>
</app-listado-generico>
